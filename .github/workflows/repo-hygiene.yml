name: Repo hygiene

# Unreal projects cannot be meaningfully built on a hosted runner (the engine is
# ~100GB and licence-gated), so CI guards the things that CAN be checked without
# it -- and that are expensive to fix after the fact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Binaries, LFS, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Deliberately do NOT fetch LFS objects: the checks read pointer files
          # from the index, and downloading real assets would burn LFS bandwidth
          # on every CI run.
          lfs: false
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash tools/scripts/check-repo-hygiene.sh

  asset-conflict-warning:
    name: Unmergeable asset warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Flag binary assets touched by this PR
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          assets=$(git diff --name-only "$base" "$head" -- '*.uasset' '*.umap' || true)

          if [ -z "$assets" ]; then
            echo "No binary assets touched."
            exit 0
          fi

          count=$(printf '%s\n' "$assets" | wc -l)
          echo "::warning::This PR modifies $count binary asset(s). These cannot be merged by git -- if another branch touches the same file, one side's work is lost. Land this promptly."
          printf '%s\n' "$assets"

          maps=$(printf '%s\n' "$assets" | grep '\.umap$' || true)
          if [ -n "$maps" ]; then
            echo "::warning::Level files modified. Levels are the most common source of unresolvable conflicts -- confirm nobody else is working in them."
            printf '%s\n' "$maps"
          fi
