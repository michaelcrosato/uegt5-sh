; FOOTCANDLE engine configuration.
; Renderer values here implement ADR-0004 (100% real-time HWRT lighting) and
; docs/ROADMAP.md §6. Keys were verified against the installed UE 5.8.2
; RendererSettings.h. Do not hand-edit casually (CLAUDE.md rule 5); cvars that
; have no Project Settings surface are listed with a reason.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Footcandle.FCGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.RendererSettings]
; --- ADR-0004: hardware ray tracing required; nothing baked ---
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.MegaLights.EnableForProject=True
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
; TSR is the vendor-free AA/upscale baseline; DLSS replaces it when active (ADR-0007).
r.AntiAliasingMethod=4
; Motion blur default off (ROADMAP 11.4); optional in settings later.
r.DefaultFeature.MotionBlur=False
; Deferred renderer + volumetric fog are load-bearing (§6.9).
r.VolumetricFog=True

[/Script/Engine.Engine]
; Small-team ergonomics: fatal-error screens over silent crashes in dev.
bSuppressMapWarnings=False

[/Script/NavigationSystem.NavigationSystemV1]
; Runtime worlds are code-spawned (no editor nav volumes): generate navmesh
; dynamically around invokers (hunters register as invokers).
bGenerateNavigationOnlyAroundNavigationInvokers=True

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=BA16B47745ABD3FA800482AEB040E672
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

